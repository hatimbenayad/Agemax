[workspace]
resolver = "2"
members = [
    "crates/agemax-core",
    "crates/agemax-term",
    "crates/agemax-agy",
    "crates/agemax-ipc",
    "crates/agemax-config",
    "crates/agemax-app",
    "crates/agemax-cli",
]
exclude = [
    "spikes/s2_osc7501",
    "spikes/s5_benchmark",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Age Max Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/agemax/agemax"

[workspace.dependencies]
thiserror = "2.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
toml = "0.8"
windows = { version = "0.62", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "UI_Notifications",
    "Data_Xml_Dom"
] }
portable-pty = "0.8"
alacritty_terminal = "0.24"
parking_lot = "0.12"
crossbeam-channel = "0.5"
uuid = { version = "1.10", features = ["v4", "serde"] }
directories = "5.0"
notify = "6.1"
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.37"
raw-window-handle = "0.6"
webview2-com = "0.39"
